# ═══════════════════════════════════════════════════════════════════
# 🌐 NGINX CONFIGURATION - REVERSE PROXY & STATIC FILES
# ═══════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ──────────────────────────────────────────────────────────────
    # PERFORMANCE OPTIMIZATIONS
    # ──────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ──────────────────────────────────────────────────────────────
    # UPSTREAM SERVERS
    # ──────────────────────────────────────────────────────────────
    upstream fastapi_app {
        # Use least_conn for load balancing
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ──────────────────────────────────────────────────────────────
    # HTTP REDIRECT TO HTTPS
    # ──────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        
        # LetsEncrypt challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # HTTPS SERVER (MAIN)
    # ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # ────────────────────────────────────────────────────────
        # SSL CONFIGURATION
        # ────────────────────────────────────────────────────────
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ────────────────────────────────────────────────────────
        # SECURITY HEADERS
        # ────────────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        # CORS for Telegram WebApp
        add_header Access-Control-Allow-Origin "https://web.telegram.org" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # ────────────────────────────────────────────────────────
        # LOGGING
        # ────────────────────────────────────────────────────────
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        # ────────────────────────────────────────────────────────
        # STATIC FILES (CSS, JS, Images)
        # ────────────────────────────────────────────────────────
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Cache for images
        location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            alias /usr/share/nginx/html/static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache for fonts
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            alias /usr/share/nginx/html/static/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ────────────────────────────────────────────────────────
        # FASTAPI API ROUTES
        # ────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;

            # No redirect
            proxy_redirect off;
        }

        # ────────────────────────────────────────────────────────
        # ADMIN PANEL
        # ────────────────────────────────────────────────────────
        location /admin {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ────────────────────────────────────────────────────────
        # WEB APP (INDEX.HTML & SPA ROUTING)
        # ────────────────────────────────────────────────────────
        location / {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA fallback
            error_page 404 = /;
        }

        # ────────────────────────────────────────────────────────
        # HEALTH CHECK
        # ────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ────────────────────────────────────────────────────────
        # DENY ACCESS TO SENSITIVE FILES
        # ────────────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
